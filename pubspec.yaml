name: raccontamela
description: AI storytelling app for children with illustrated stories and premium narration.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  supabase_flutter: ^2.17.2
  in_app_purchase: ^3.3.1
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  just_audio: ^0.10.6
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/stories/master_stories.json
