name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create . --platforms=android --org com.vincedambro

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate Raccontamela launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          cat > /tmp/raccontamela_icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="112" fill="#6C63FF"/>
            <path d="M92 154c0-18 15-33 33-33h98c29 0 56 11 79 31 23-20 50-31 79-31h98c18 0 33 15 33 33v210c0 18-15 33-33 33h-98c-29 0-56 11-79 31-23-20-50-31-79-31h-98c-18 0-33-15-33-33V154Z" fill="#fff"/>
            <path d="M256 153v242" stroke="#6C63FF" stroke-width="18" stroke-linecap="round"/>
            <path d="M129 190h77M129 235h77M129 280h61M306 190h77M306 235h77M306 280h61" stroke="#B9B5FF" stroke-width="15" stroke-linecap="round"/>
            <path d="M390 92l9 22 22 9-22 9-9 22-9-22-22-9 22-9 9-22Z" fill="#FFD166"/>
            <path d="M128 79l6 15 15 6-15 6-6 15-6-15-15-6 15-6 6-15Z" fill="#FFD166"/>
          </svg>
          SVG

          convert -background none /tmp/raccontamela_icon.svg -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert -background none /tmp/raccontamela_icon.svg -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert -background none /tmp/raccontamela_icon.svg -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert -background none /tmp/raccontamela_icon.svg -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert -background none /tmp/raccontamela_icon.svg -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Harden Android Play configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          s = s.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raccontamela-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
