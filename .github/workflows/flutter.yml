name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create . --platforms=android --org com.vincedambro
      - name: Install launcher artwork
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/raccontamela_launcher.jpg
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          cp assets/raccontamela_launcher.jpg android/app/src/main/res/mipmap-mdpi/ic_launcher.jpg
          cp assets/raccontamela_launcher.jpg android/app/src/main/res/mipmap-hdpi/ic_launcher.jpg
          cp assets/raccontamela_launcher.jpg android/app/src/main/res/mipmap-xhdpi/ic_launcher.jpg
          cp assets/raccontamela_launcher.jpg android/app/src/main/res/mipmap-xxhdpi/ic_launcher.jpg
          cp assets/raccontamela_launcher.jpg android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.jpg
      - name: Harden Android Play configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle.kts")
          s=p.read_text().replace("compileSdk = flutter.compileSdkVersion","compileSdk = 36").replace("targetSdk = flutter.targetSdkVersion","targetSdk = 36")
          p.write_text(s)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
      - name: Build release App Bundle
        run: flutter build appbundle --release --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raccontamela-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
