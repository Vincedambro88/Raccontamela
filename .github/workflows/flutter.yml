name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create . --platforms=android --org com.vincedambro
      - name: Install launcher artwork
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/raccontamela_launcher.jpg
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$d"
            rm -f "$dir/ic_launcher.png" "$dir/ic_launcher.xml" "$dir/ic_launcher_round.png" "$dir/ic_launcher_round.xml"
            cp assets/raccontamela_launcher.jpg "$dir/ic_launcher.jpg"
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Harden Android Play configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle.kts")
          s=p.read_text().replace("compileSdk = flutter.compileSdkVersion","compileSdk = 36").replace("targetSdk = flutter.targetSdkVersion","targetSdk = 36")
          p.write_text(s)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL="https://psbdgeeknuxmdbvblvrx.supabase.co" --dart-define=SUPABASE_PUBLISHABLE_KEY="sb_publishable_8wB_7JUnMOQ4Gccj7_mPCg_uJMSr4O3"
      - name: Build release App Bundle
        run: flutter build appbundle --release --dart-define=SUPABASE_URL="https://psbdgeeknuxmdbvblvrx.supabase.co" --dart-define=SUPABASE_PUBLISHABLE_KEY="sb_publishable_8wB_7JUnMOQ4Gccj7_mPCg_uJMSr4O3"
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raccontamela-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
